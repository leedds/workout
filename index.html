<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout</title>
<style>
body{margin:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}
.wrap{max-width:520px;margin:auto;padding:18px 14px 90px}
h1{font-size:28px;margin:6px 0 4px}.sub{color:#777;font-size:13px;margin-bottom:14px}
.progressRow{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:13px;font-weight:700}
.progressBar{height:8px;background:#e8e8ea;border-radius:999px;overflow:hidden;margin-bottom:14px}
.progressBar>div{height:100%;background:#111;width:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tabs button{border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px 4px;font-weight:700}
.tabs button.active{background:#111;color:#fff;border-color:#111}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:16px}
.head{display:flex;justify-content:space-between;gap:10px;align-items:start}
.head h2{font-size:22px;margin:0}.tag{font-size:11px;background:#eee;padding:6px 8px;border-radius:999px}
.sec{margin-top:16px;padding-top:14px;border-top:1px solid #eee}
.label{font-size:12px;color:#777;font-weight:700;margin-bottom:8px}
.ex{border:1px solid #e7e7e7;border-radius:14px;padding:12px;margin-top:8px}
.top{display:flex;gap:10px;align-items:start}
.top input{width:22px;height:22px}.name{font-weight:800;font-size:16px}.part{font-size:12px;color:#777;margin-top:2px}
.grid{display:grid;grid-template-columns:1.2fr .9fr .9fr;gap:8px;margin-top:10px}
.grid input{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:10px;padding:10px;text-align:center;font-size:14px}
.small{font-size:11px;color:#777;margin-top:7px;line-height:1.4}
.alt{margin-top:9px;background:#f7f7f8;border-radius:10px;padding:9px}
.alt strong{display:block;font-size:11px;margin-bottom:4px}.alt div{font-size:12px;margin:4px 0}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(245,245,247,.95);padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd}
.bottom button{display:block;width:100%;max-width:520px;margin:auto;border:0;border-radius:14px;background:#111;color:white;padding:14px;font-weight:800;font-size:15px}
.done{background:#edf8ef}
</style>
</head>
<body>
<div class="wrap">
<h1>Workout</h1>
<div class="sub">Muscle Gain · 4 Days/Week · Elbow & Low-Back Friendly</div>
<div class="progressRow"><span>This Week</span><span id="weekCount">0 / 4</span></div>
<div class="progressBar"><div id="weekBar"></div></div>
<div class="tabs">
<button data-day="0" class="active">DAY 1</button>
<button data-day="1">DAY 2</button>
<button data-day="2">DAY 3</button>
<button data-day="3">DAY 4</button>
</div>
<div id="content"></div>
</div>
<div class="bottom"><button id="complete">Complete Today's Workout</button></div>

<script>
const plans=[
{title:"Core / Low Back Support",tag:"CORE",
 body:{name:"Dead Bug",part:"Deep Core / Trunk Stability",reps:"8-10 / side",sets:"2"},
 machines:[
  {name:"Cable Pallof Press",part:"Core / Anti-Rotation",reps:"8-12 / side",sets:"3",alts:["Seated Cable Pallof Press","Standing Cable Anti-Rotation Hold"]},
  {name:"Hip Thrust Machine",part:"Glutes / Pelvic Stability",reps:"8-12",sets:"3",alts:["Glute Drive Machine","Glute Bridge Machine"]}
 ]},
{title:"Shoulders / Back",tag:"BACK",
 body:{name:"Jumping Jacks",part:"Warm-Up",reps:"30-40",sets:"2"},
 machines:[
  {name:"Reverse Pec Deck",part:"Rear Delts / Upper Back",reps:"8-12",sets:"3",alts:["Rear Delt Machine","Cable Rear Delt Fly"]},
  {name:"Lateral Raise Machine",part:"Side Delts",reps:"10-15",sets:"3",alts:["Cable Lateral Raise","Dumbbell Lateral Raise"]}
 ]},
{title:"Arms",tag:"ARMS",
 body:{name:"High Knees",part:"Warm-Up",reps:"30-40",sets:"2"},
 machines:[
  {name:"Rope Hammer Curl",part:"Biceps / Brachialis",reps:"8-12",sets:"3",alts:["Cable Hammer Curl","Biceps Curl Machine"]},
  {name:"Rope Triceps Pushdown",part:"Triceps",reps:"8-12",sets:"3",alts:["Cable Bar Pushdown","Triceps Extension Machine"]}
 ]},
{title:"Lower Body",tag:"LEGS",
 body:{name:"Bodyweight Squat",part:"Quads / Glutes",reps:"15-20",sets:"2"},
 machines:[
  {name:"Leg Press",part:"Quads / Glutes",reps:"8-12",sets:"3",alts:["Hack Squat Machine","Smith Machine Squat"]},
  {name:"Leg Curl",part:"Hamstrings",reps:"8-12",sets:"3",alts:["Seated Leg Curl","Lying Leg Curl"]}
 ]}
];

let day=Number(localStorage.getItem("workout_day")||0);
const stateKey=d=>"workout_state_"+d;
const doneKey=d=>"workout_done_"+d;
const getState=d=>JSON.parse(localStorage.getItem(stateKey(d))||"{}");
const saveState=(d,s)=>localStorage.setItem(stateKey(d),JSON.stringify(s));

function exHTML(ex,id,body=false){
 const s=getState(day), x=s[id]||{};
 return `<div class="ex ${x.done?"done":""}" data-wrap="${id}">
 <div class="top"><input type="checkbox" data-check="${id}" ${x.done?"checked":""}><div><div class="name">${ex.name}</div><div class="part">${ex.part}</div></div></div>
 <div class="grid">
  <input data-id="${id}" data-field="weight" value="${x.weight??(body?"Bodyweight":"")}" placeholder="Weight">
  <input data-id="${id}" data-field="reps" value="${x.reps??ex.reps}" placeholder="Reps">
  <input data-id="${id}" data-field="sets" value="${x.sets??ex.sets}" placeholder="Sets">
 </div>
 ${ex.alts?`<div class="alt"><strong>Alternatives</strong><div>1. ${ex.alts[0]}</div><div>2. ${ex.alts[1]}</div></div>`:""}
 </div>`;
}

function updateWeek(){
 let n=0;
 for(let i=0;i<4;i++) if(localStorage.getItem(doneKey(i))==="1") n++;
 document.getElementById("weekCount").textContent=`${n} / 4`;
 document.getElementById("weekBar").style.width=`${n*25}%`;
}

function render(){
 document.querySelectorAll(".tabs button").forEach((b,i)=>b.classList.toggle("active",i===day));
 const p=plans[day];
 document.getElementById("content").innerHTML=`<div class="card">
 <div class="head"><h2>${p.title}</h2><span class="tag">${p.tag}</span></div>
 <div class="sec"><div class="label">BODYWEIGHT · 1 EXERCISE</div>${exHTML(p.body,"b0",true)}</div>
 <div class="sec"><div class="label">MACHINES / CABLES · 2 EXERCISES</div>${p.machines.map((m,i)=>exHTML(m,"m"+i)).join("")}</div>
 <div class="small">${day===0
 ? "Keep your spine neutral and move slowly. Avoid exercises that reproduce low-back pain, especially loaded bending, twisting, or back extension."
 : day===2
 ? "Only perform direct arm exercises if they are pain-free. Stop if you feel elbow pain."
 : "Stop any exercise that causes elbow or low-back pain. Push-ups, pull-ups, dead hangs, and planks are intentionally excluded."}</div>
 </div>`;

 document.querySelectorAll("[data-check]").forEach(el=>el.onchange=()=>{
   const s=getState(day),id=el.dataset.check;s[id]=s[id]||{};s[id].done=el.checked;saveState(day,s);render();
 });
 document.querySelectorAll("[data-field]").forEach(el=>el.oninput=()=>{
   const s=getState(day),id=el.dataset.id;s[id]=s[id]||{};s[id][el.dataset.field]=el.value;saveState(day,s);
 });
 document.getElementById("complete").textContent=localStorage.getItem(doneKey(day))==="1"?"Undo Completion":"Complete Today's Workout";
 updateWeek();
}

document.querySelectorAll(".tabs button").forEach(btn=>btn.onclick=()=>{
 day=Number(btn.dataset.day);localStorage.setItem("workout_day",day);render();
});
document.getElementById("complete").onclick=()=>{
 const k=doneKey(day);
 if(localStorage.getItem(k)==="1") localStorage.removeItem(k); else localStorage.setItem(k,"1");
 render();
};
render();
</script>
</body>
</html>
